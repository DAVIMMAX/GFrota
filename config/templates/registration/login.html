{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFrota - Acesso Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --primary-dark: #2e59d9;
            --background: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(78, 115, 223, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-light {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(78, 115, 223, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #4e73df, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-control:focus+.form-label {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 14px rgba(78, 115, 223, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 115, 223, 0.6);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }

            100% {
                transform: scale(100, 100);
                opacity: 0;
            }
        }

        .btn-login:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--error-color);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .meta-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }

        .meta-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .meta-links a:hover {
            color: var(--primary);
        }

        /* Decorative dots */
        .decor-dot {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(8px);
            opacity: 0.4;
            z-index: 0;
        }

        .dot-1 {
            top: 20%;
            left: 20%;
            width: 100px;
            height: 100px;
            background: #4e73df;
        }

        .dot-2 {
            bottom: 15%;
            right: 25%;
            width: 150px;
            height: 150px;
            background: #38bdf8;
        }

        .dot-3 {
            top: 40%;
            right: 15%;
            width: 60px;
            height: 60px;
            background: #818cf8;
        }
    </style>
    <!-- Include FontAwesome for icons. Ideally served locally but fallback to CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="decor-dot dot-1"></div>
    <div class="decor-dot dot-2"></div>
    <div class="decor-dot dot-3"></div>
    <div class="ambient-light"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="brand-icon">
                <i class="fas fa-podcast"></i>
            </div>
            <h1>GFrota</h1>
            <p>Bem-vindo de volta! Faça login na sua conta.</p>
        </div>

        {% if form.errors %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle mr-2"></i>
            Nome de usuário ou senha incorretos. Tente novamente.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                    class="form-control" placeholder="Digite seu nome de usuário" required autofocus
                    value="{{ form.username.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                    class="form-control" placeholder="Digite sua senha" required>
            </div>

            <!-- This hidden input helps redirect back to where the user came from -->
            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn-login">
                Entrar no Sistema
            </button>
        </form>

        <div class="meta-links">
            <a href="#">Esqueceu a senha?</a>
            <!--reservado para quando for possível recuperar a senha.-->
            <!-- <a href="{% url 'usuarios:cadastro' %}">Criar conta</a> -->
        </div>
    </div>

    <script>
        // Micro animation for input interaction delay
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'scale(1.02)';
                input.parentElement.style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>

</html>
