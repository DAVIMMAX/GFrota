{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block title %}GFrota - Pagamento de Radios Para o Serviço{% endblock %}


{% block content %}
div class="row">
<div class="col-xl-8 col-lg-10 mx-auto">
    <!-- Cartão Principal -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary">Preencha os Dados do Serviço Operacional a ser cadastrado
            </h6>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </form>
        </div>
    </div>
</div>
</div>

{% endblock %}
